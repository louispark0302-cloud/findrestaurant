<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoodFood - 오늘 당신의 기분은 어떤가요?</title>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA1dL7qYnUnAX70JdI7VpxE4Wopdduvpus",
      authDomain: "findrestaurant-5eeef.firebaseapp.com",
      projectId: "findrestaurant-5eeef",
      storageBucket: "findrestaurant-5eeef.firebasestorage.app",
      messagingSenderId: "1082818908084",
      appId: "1:1082818908084:web:ec03195c35ec388a4d2ce1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.Firebase = { db, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp };
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
    html { scroll-behavior: smooth; }
    body { font-family: 'Noto Sans KR', sans-serif; background-color: #ffffff; }
    .search-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
    .header-link { position: relative; transition: color 0.3s; }
    .header-link:after { content: ''; position: absolute; width: 0; height: 2px; bottom: -4px; left: 0; background-color: #B23D1F; transition: width 0.3s; }
    .header-link:hover:after { width: 100%; }
    .active-link:after { width: 100%; }
  </style>
</head>
<body class="text-slate-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [mood, setMood] = useState('');
      const [location, setLocation] = useState(null);
      const [addressName, setAddressName] = useState('');
      const [loading, setLoading] = useState(false);
      const [places, setPlaces] = useState([]);
      const [feedbacks, setFeedbacks] = useState([]);
      const [nickname, setNickname] = useState('');
      const [comment, setComment] = useState('');

      useEffect(() => {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            async (pos) => {
              const lat = pos.coords.latitude;
              const lng = pos.coords.longitude;
              setLocation({ lat, lng });

              try {
                const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=14`);
                const geoData = await geoRes.json();
                if (geoData && geoData.address) {
                  const addr = `${geoData.address.city || geoData.address.province || ''} ${geoData.address.borough || geoData.address.suburb || ''}`.trim();
                  setAddressName(addr);
                }
              } catch (e) {
                console.warn("주소 변환 실패:", e);
              }
            }, 
            (err) => console.error("위치 수집 실패:", err),
            { enableHighAccuracy: true, timeout: 10000 }
          );
        }
      }, []);

      useEffect(() => {
        const checkFirebase = setInterval(() => {
          if (window.Firebase) {
            clearInterval(checkFirebase);
            const { db, collection, query, orderBy, onSnapshot } = window.Firebase;
            const q = query(collection(db, "feedbacks"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snap) => {
              setFeedbacks(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
            });
          }
        }, 100);
        return () => clearInterval(checkFirebase);
      }, []);

      const getRecommendation = async (e) => {
        if (e) e.preventDefault();
        
        if (!mood.trim()) {
          alert('기분이나 원하는 음식을 입력해주세요!');
          return;
        }

        setLoading(true);
        setPlaces([]);

        const lat = location ? location.lat : 37.5665;
        const lng = location ? location.lng : 126.9780;

        try {
          const res = await fetch('/api/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
              latitude: lat, 
              longitude: lng, 
              mood: mood.trim() 
            })
          });

          const data = await res.json();
          if (res.ok && Array.isArray(data.result)) {
            setPlaces(data.result);
          } else {
            alert(data.error || "추천 정보를 가져오는 도중 오류가 발생했습니다.");
          }
        } catch (err) { 
          alert("서버 통신 실패: " + err.message); 
        } finally {
          setLoading(false);
        }
      };

      const postFeedback = async (e) => {
        e.preventDefault();
        if (!comment.trim()) return;
        const { db, collection, addDoc, serverTimestamp } = window.Firebase;
        await addDoc(collection(db, "feedbacks"), {
          nickname: nickname || '익명',
          content: comment,
          createdAt: serverTimestamp()
        });
        setNickname(''); setComment('');
      };

      const scrollToCommunity = (e) => {
        e.preventDefault();
        document.getElementById('community-section')?.scrollIntoView({ behavior: 'smooth' });
      };

      const scrollToDiscover = (e) => {
        e.preventDefault();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const getDirectionsUrl = (placeName) => {
        const dest = encodeURIComponent(placeName);
        if (location) {
          return `https://map.naver.com/v5/directions/${location.lng},${location.lat},내위치,,ADDRESS_POI/-/-/-/sroute?e=${dest}`;
        }
        return `https://map.naver.com/v5/search/${dest}`;
      };

      return (
        <div class="min-h-screen flex flex-col">
          {/* NAVIGATION */}
          <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-100">
            <div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
              <div onClick={scrollToDiscover} class="text-2xl font-black text-[#B23D1F] tracking-tight cursor-pointer">MoodFood</div>
              <nav class="hidden md:flex items-center gap-10 text-[15px] font-medium text-slate-600">
                <a href="#" onClick={scrollToDiscover} class="header-link active-link text-[#B23D1F]">Discover</a>
                <a href="#community-section" onClick={scrollToCommunity} class="header-link hover:text-[#B23D1F]">Community</a>
              </nav>
              <div class="flex items-center gap-3 text-slate-500 text-xs">
                <i class={`fa-solid fa-location-dot ${location ? 'text-emerald-500' : 'text-slate-300'}`}></i>
                <span>{addressName || (location ? '위치 확인 완료' : '위치 가져오는 중')}</span>
              </div>
            </div>
          </header>

          {/* HERO SECTION */}
          <section class="pt-20 pb-20 px-6 bg-gradient-to-b from-white to-slate-50">
            <div class="max-w-4xl mx-auto text-center">
              <h1 class="text-5xl font-bold mb-6 tracking-tight">
                오늘 당신의 <span class="text-[#B23D1F]">기분</span>은 어떤가요?
              </h1>
              <p class="text-slate-500 text-lg mb-10 font-light leading-relaxed">
                지친 하루 끝에 따뜻한 위로가 되는 맛,<br/>
                당신의 감정에 가장 어울리는 한 끼를 제안합니다.
              </p>

              {/* SEARCH BAR */}
              <form onSubmit={getRecommendation} class="relative max-w-2xl mx-auto mb-6">
                <input 
                  type="text" 
                  value={mood}
                  onChange={(e) => setMood(e.target.value)}
                  placeholder="지금 어떤 기분이신가요? (예: 스트레스 풀 매운 거)"
                  class="w-full h-16 pl-8 pr-20 rounded-full border border-slate-200 search-shadow focus:outline-none focus:ring-2 focus:ring-[#B23D1F]/20 text-slate-700 transition-all"
                />
                <button 
                  type="button"
                  onClick={getRecommendation} 
                  disabled={loading}
                  class="absolute right-2 top-2 w-12 h-12 bg-[#B23D1F] text-white rounded-full flex items-center justify-center hover:bg-[#8e3119] transition-colors cursor-pointer disabled:bg-slate-300"
                >
                  {loading ? (
                    <i class="fa-solid fa-spinner animate-spin"></i>
                  ) : (
                    <i class="fa-solid fa-magnifying-glass pointer-events-none"></i>
                  )}
                </button>
              </form>
              
              <button 
                type="button"
                onClick={() => {setMood(''); setPlaces([]);}} 
                class="text-slate-400 text-sm flex items-center gap-2 mx-auto hover:text-slate-600 transition-colors"
              >
                <i class="fa-solid fa-rotate-right"></i> 다시 시작하기
              </button>
            </div>

            {/* AI RESULT CARDS (가로 3열) */}
            {places.length > 0 && (
              <div class="max-w-6xl mx-auto mt-12 px-2">
                <div class="flex items-center gap-3 mb-6">
                  <span class="bg-[#B23D1F] text-white text-xs font-bold px-3 py-1 rounded-full">AI 추천 결과</span>
                  <h3 class="font-bold text-slate-800 text-lg">당신만을 위한 맞춤 맛집 추천</h3>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                  {places.map((place, idx) => (
                    <div key={idx} class="bg-white rounded-3xl p-6 border border-slate-100 shadow-md hover:shadow-xl transition-all duration-300 flex flex-col justify-between">
                      <div>
                        <div class="flex items-center justify-between mb-3">
                          <span class="text-xs font-bold text-[#B23D1F] bg-[#B23D1F]/10 px-2.5 py-1 rounded-lg">
                            {place.category || '맛집'}
                          </span>
                          <span class="text-xs font-semibold text-slate-400">TOP {idx + 1}</span>
                        </div>
                        <h4 class="text-xl font-bold text-slate-800 mb-2">{place.name}</h4>
                        <div class="text-xs font-medium text-slate-500 mb-4 bg-slate-50 p-2.5 rounded-xl">
                          <i class="fa-solid fa-utensils text-[#B23D1F] mr-1"></i> 대표 메뉴: <span class="text-slate-700 font-bold">{place.menu}</span>
                        </div>
                        <p class="text-sm text-slate-600 leading-relaxed font-light mb-6">
                          {place.reason}
                        </p>
                      </div>

                      <div class="flex gap-2">
                        <a 
                          href={getDirectionsUrl(place.name)}
                          target="_blank"
                          rel="noreferrer"
                          class="flex-1 py-2.5 bg-[#B23D1F] hover:bg-[#8e3119] text-white text-xs font-bold rounded-xl text-center transition-colors block"
                        >
                          <i class="fa-solid fa-diamond-turn-right mr-1"></i> 길찾기
                        </a>
                        <a 
                          href={`https://map.naver.com/v5/search/${encodeURIComponent(place.name)}`}
                          target="_blank"
                          rel="noreferrer"
                          class="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium rounded-xl text-center transition-colors block"
                        >
                          지도 상세 <i class="fa-solid fa-arrow-up-right-from-square ml-0.5 text-[10px]"></i>
                        </a>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </section>

          {/* COMMUNITY FEED */}
          <main class="max-w-6xl mx-auto px-6 py-16 w-full grid grid-cols-1 lg:grid-cols-12 gap-12">
            <div id="community-section" class="lg:col-span-8 scroll-mt-28">
              <div class="flex items-center justify-between mb-8">
                <h2 class="text-3xl font-bold tracking-tight text-slate-800">Community Feed</h2>
              </div>

              <div class="bg-white border border-slate-100 rounded-3xl p-6 mb-12 shadow-sm">
                <form onSubmit={postFeedback} class="space-y-4">
                  <input 
                    type="text" 
                    placeholder="닉네임" 
                    value={nickname}
                    onChange={(e) => setNickname(e.target.value)}
                    class="bg-slate-50 border-none rounded-xl px-4 py-2 text-sm focus:ring-1 focus:ring-[#B23D1F]/30"
                  />
                  <textarea 
                    placeholder="오늘 맛본 특별한 미식 경험을 공유해 주세요." 
                    value={comment}
                    onChange={(e) => setComment(e.target.value)}
                    class="w-full bg-slate-50 border-none rounded-2xl p-4 text-[15px] focus:ring-1 focus:ring-[#B23D1F]/30 h-28"
                  ></textarea>
                  <div class="flex justify-end">
                    <button class="bg-slate-900 text-white px-6 py-2.5 rounded-full text-sm font-medium hover:bg-slate-800 transition-all">공유하기</button>
                  </div>
                </form>
              </div>

              <div class="space-y-6">
                {feedbacks.length > 0 ? feedbacks.map((fb) => (
                  <div key={fb.id} class="bg-white border border-slate-100 rounded-3xl p-6 hover:shadow-md transition-shadow">
                    <div class="flex items-center gap-4 mb-4">
                      <div class="w-10 h-10 rounded-full bg-[#B23D1F]/10 flex items-center justify-center text-[#B23D1F] font-bold text-sm">
                        {fb.nickname?.[0] || '익'}
                      </div>
                      <div>
                        <div class="font-bold text-slate-800 text-sm">{fb.nickname || '익명 미식가'}</div>
                        <div class="text-[10px] text-slate-400">방금 전</div>
                      </div>
                    </div>
                    <p class="text-slate-600 text-sm leading-relaxed whitespace-pre-wrap">{fb.content}</p>
                  </div>
                )) : (
                  <div class="text-center py-12 text-slate-300">첫 기록을 남겨보세요.</div>
                )}
              </div>
            </div>

            {/* SIDEBAR */}
            <aside class="lg:col-span-4 space-y-8">
              <div class="bg-slate-50/50 rounded-3xl p-6 border border-slate-100">
                <div class="flex items-center gap-2 mb-4 text-slate-800 font-bold">
                  <i class="fa-solid fa-arrow-trend-up text-[#B23D1F]"></i> 인기 키워드
                </div>
                <div class="flex flex-wrap gap-2">
                  {['혼밥하기좋은', '데이트코스', '가성비맛집', '분위기깡패', '비오는날추천', '스트레스해소'].map(tag => (
                    <span 
                      key={tag} 
                      onClick={() => setMood(tag)}
                      class="px-3 py-1.5 bg-white border border-slate-200 rounded-full text-xs text-slate-600 hover:border-[#B23D1F]/30 cursor-pointer transition-all"
                    >
                      #{tag}
                    </span>
                  ))}
                </div>
              </div>
            </aside>
          </main>

          <footer class="mt-auto border-t border-slate-100 py-8 px-6 text-center text-slate-400 text-xs">
            © 2026 MoodFood. Your Digital Culinary Concierge.
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
